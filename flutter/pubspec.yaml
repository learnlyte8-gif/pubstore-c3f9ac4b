name: pubstore
description: PUBSTORE — native marketplace (Flutter mirror of the web + RN clients).
publish_to: "none"
version: 11.0.0+11

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend — same Lovable Cloud (Supabase) as web + RN
  supabase_flutter: ^2.5.6

  # State / routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0

  # Storage / device
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Native features
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  app_links: ^6.3.2
  google_sign_in: ^6.2.1
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
