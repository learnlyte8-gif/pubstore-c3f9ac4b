name: pubstore
description: PUBSTORE - The everything marketplace (Flutter shell). Mobile application with Supabase backend integration.
publish_to: 'none'
version: 11.0.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  
  # Networking
  http: ^1.2.0
  dio: ^5.3.1
  connectivity_plus: ^5.0.2
  
  # Storage & State Management
  shared_preferences: ^2.2.2
  provider: ^6.0.1
  get: ^4.6.5
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.7
  
  # Backend
  supabase_flutter: ^2.5.0
  
  # Form & Validation
  form_builder_validators: ^9.1.0
  flutter_form_builder: ^9.1.0
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1
  
  # Navigation
  go_router: ^12.0.0
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.1
  geolocator: ^9.0.2
  
  # Media
  image_picker: ^1.0.4
  camera: ^0.10.5
  video_player: ^2.7.2
  
  # Permissions
  permission_handler: ^11.4.4
  
  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  flutter_local_notifications: ^14.1.1
  
  # Utilities
  uuid: ^4.0.0
  intl: ^0.19.0
  date_time_picker: ^2.1.0
  url_launcher: ^6.2.5
  package_info_plus: ^5.0.1
  device_info_plus: ^9.0.2
  
  # Analytics & Logging
  firebase_analytics: ^10.7.0
  
  # Deep Linking & App Links
  app_links: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
