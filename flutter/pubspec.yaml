name: pubstore
description: PUBSTORE - The everything marketplace (Flutter shell)
publish_to: 'none'
version: 11.0.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0
  supabase_flutter: ^2.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
